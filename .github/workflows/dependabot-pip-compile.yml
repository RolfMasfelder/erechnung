name: Regenerate requirements.txt for Dependabot PRs

on:
  pull_request_target:
    paths:
      - requirements.in

# Write access needed to commit requirements.txt back to the Dependabot branch
permissions:
  contents: write

jobs:
  pip-compile:
    name: Regenerate requirements.txt
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
    - name: Checkout PR branch
      uses: actions/checkout@v6
      with:
        ref: ${{ github.head_ref }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install pip-tools
      run: pip install pip-tools

    - name: Regenerate requirements.txt
      run: pip-compile requirements.in

    - name: Commit and push if changed
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add requirements.txt
        git diff --staged --quiet && echo "requirements.txt unchanged" && exit 0
        git commit -m "chore: regenerate requirements.txt"
        git push
